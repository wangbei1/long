denoising_step_list:
- 1000
- 750
- 500
- 250
warp_denoising_step: true # need to remove - 0 in denoising_step_list if warp_denoising_step is true
num_frame_per_block: 3
model_name: Wan2.1-T2V-1.3B
model_kwargs:
  local_attn_size: 12
  timestep_shift: 5.0
  sink_size: 3


# inference
data_path: longlive_models/prompts/vidprom_filtered_extended.txt
output_folder: videos/long_180s
inference_iter: 0            # only generate the first prompt (one 180s video)
num_output_frames: 720       # 720 latent frames ≈ 2880 pixel frames @16fps = 180s
use_ema: false
seed: 0
num_samples: 1
save_with_index: true
global_sink: true
context_noise: 0

# 只用短片训练得到的主干, 不加载 LoRA
generator_ckpt: longlive_models/models/longlive_base.pt
# lora_ckpt / adapter 均未设置 -> inference.py 不会给 generator 套 LoRA
